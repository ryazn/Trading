# ================================================
# PHANTOM CVD Strategy - 5-YEAR OPTIMIZED
# ================================================
# Optimized via sensitivity analysis on 2023-2025, validated on full 2021-2025
#
# KEY FINDING: min_strength=0.6 is the single most impactful parameter.
# It filters out weak CVD divergences, keeping only high-conviction signals.
#
# Config B: 5-Year Results (2021-2025)
#   Net P&L:  +$10,875 (+10.87%)
#   Trades:   228 (46 per year)
#   Win Rate: 46.1%
#   PF:       1.28
#   Max DD:   6.96%
#   Sharpe:   0.23
#   Avg Trade: $47.70
#   Consistent: Profitable in 2023, 2024, and 2025 individually

data:
  source: "csv"
  csv_path: "data/es_1min"

strategy:
  # CVD — no smoothing (raw divergence is best)
  cvd_smooth: 1
  cvd_anchor_bars: 390

  # Swing Detection — pivot_right=1 for fast confirmation
  pivot_left: 10
  pivot_right: 1
  max_level_age: 100
  max_levels: 30

  # Sweep Detection — default threshold
  sweep_ticks: 2
  tick_size: 0.25

  # Strength Filter — THIS IS THE KEY PARAMETER
  # 0.6 filters out 75% of weak signals, keeping only strong divergences
  min_strength: 0.6
  strength_period: 100

  # CVD Momentum — OFF (hurts when combined with high strength filter)
  use_momentum_filter: false
  momentum_bars: 5
  momentum_tolerance: 0.02

  # Signal Control
  signal_cooldown: 5

  # Direction
  allow_longs: true
  allow_shorts: true

risk:
  initial_capital: 100000.0

  # Fixed 1 contract — cleanest signal evaluation
  position_mode: "fixed_contracts"
  fixed_contracts: 1

  # Stop Loss — ATR x2.5 gives room to breathe
  use_stop_loss: true
  sl_mode: "atr"
  sl_atr_mult: 2.5
  sl_atr_period: 14

  # Take Profit — 1.5:1 R:R (more achievable, higher WR)
  use_take_profit: true
  tp_mode: "risk_reward"
  tp_rr_ratio: 1.5

  # Trailing/BE — OFF
  use_trailing: false
  use_breakeven: false

  # Session Filter — RTH only (9:30-16:00 ET)
  use_session_filter: true
  session_start_hour: 9
  session_start_minute: 30
  session_end_hour: 16
  session_end_minute: 0
  close_at_session_end: true

  # Risk limits
  use_max_drawdown: false
  use_daily_loss_limit: false
  use_max_hold: false

  # Costs (ES futures)
  commission_per_contract: 1.24
  slippage_ticks: 1
  tick_size: 0.25
  point_value: 50.0
