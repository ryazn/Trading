# ================================================
# PHANTOM CVD Strategy - 5-YEAR ANALYSIS CONFIG
# ================================================
# Optimized across 3,600+ parameter combos on 2021-2025 ES 1-min data
#
# FINDING: No configuration was consistently profitable across both
# train (2021-2023) and validation (2024-2025) periods.
#
# This config is the LEAST BAD — the closest to break-even across all 5 years.
# It uses the insights that emerged from optimization:
#   1. Fixed 1 contract (removes position sizing noise)
#   2. RTH session filter (9:30-16:00 ET only)
#   3. ATR 2.5 stop loss (wider = fewer stop-outs)
#   4. 1.5:1 R:R (more achievable target, higher win rate)
#   5. pivot_right=2 (more pivot confirmation)
#   6. strength_period=100 (longer CVD lookback)
#
# See QUANT_ANALYSIS.md for improvement roadmap.

data:
  source: "csv"
  csv_path: "data/es_1min"

strategy:
  cvd_smooth: 1
  cvd_anchor_bars: 390
  pivot_left: 10
  pivot_right: 2
  max_level_age: 100
  max_levels: 30
  sweep_ticks: 2
  tick_size: 0.25
  min_strength: 0.3
  strength_period: 100
  use_momentum_filter: false
  momentum_bars: 5
  momentum_tolerance: 0.02
  signal_cooldown: 5
  allow_longs: true
  allow_shorts: true

risk:
  initial_capital: 100000.0
  position_mode: "fixed_contracts"
  fixed_contracts: 1
  use_stop_loss: true
  sl_mode: "atr"
  sl_atr_mult: 2.5
  sl_atr_period: 14
  use_take_profit: true
  tp_mode: "risk_reward"
  tp_rr_ratio: 1.5
  use_trailing: false
  use_breakeven: false
  use_session_filter: true
  session_start_hour: 9
  session_start_minute: 30
  session_end_hour: 16
  session_end_minute: 0
  close_at_session_end: true
  use_max_drawdown: false
  use_daily_loss_limit: false
  use_max_hold: false
  max_hold_bars: 120
  commission_per_contract: 1.24
  slippage_ticks: 1
  tick_size: 0.25
  point_value: 50.0
